services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${USERNAME}
      MYSQL_PASSWORD: ${PASSWORD}
      MYSQL_DATABASE: ${DBNAME}
    ports: 
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: . 
    depends_on:
      db:
        condition: service_healthy
    ports: 
      - "8000:80"
    volumes: 
      - .:/var/www/html
    environment:
      SERVER: ${SERVER}
      PORT: ${PORT}
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
      DBNAME: ${DBNAME}

volumes:
  db_data:
